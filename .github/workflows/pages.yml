name: Publish Uropedia
on:
  push:
    branches: [main]
    paths: ['site-part-07.zip', 'brand-overlay-v1.zip', 'brand-layout-v2.css', 'recorded-songs-v1/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the public website
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, hashlib
          target = Path('_site').resolve()
          target.mkdir()
          archives = sorted(Path('.').glob('site-part-*.zip'))
          expected = ["c80549e950d6cedd25372fe4b393c775940be21dd93fb425827d0794d3d46a90","b95d504231bda297af66d84b2f1a650f8386839f1adc7fc4a23900b1ff46c72f","992e29d5f135fbbbe25688aa29b5f5058c37d04b51142439fb5a2455531a1eaa","8030941f63e8bb7260acd677e441a09d511960dfb3fd1881a7030c0660d26144","e050b4186232a494bf9b7ff3bdf1d15178e0df8e8596aeb8382eef3f6055d601","f0a55b113ed9c62d63d9d0e25f7fd7fa8099bf27fe58ad030c2da1a73ac37aa8","c47a4ffa74d18a205f9436cbe1e698cd9b8f1fed6958e4109e03f23522650017"]
          assert len(archives) == 7, 'All seven public packages are required'
          for archive, digest in zip(archives, expected):
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == digest, archive.name
          for archive in archives:
              with zipfile.ZipFile(archive) as z:
                  for entry in z.infolist():
                      dest = (target / entry.filename).resolve()
                      if not dest.is_relative_to(target):
                          raise SystemExit('Unsafe archive path')
                  z.extractall(target)
          overlay = Path('brand-overlay-v1.zip')
          assert hashlib.sha256(overlay.read_bytes()).hexdigest() == '64a3bae282c837d47a26f672a3d452e2243419d396785e1113eaa898335227d3'
          with zipfile.ZipFile(overlay) as z:
              for entry in z.infolist():
                  assert (target / entry.filename).resolve().is_relative_to(target)
              z.extractall(target)
          (target / 'assets/brand-v1.css').write_bytes(Path('brand-layout-v2.css').read_bytes())
          for page in target.rglob('*.html'):
              page.write_text(page.read_text().replace('brand-v1.css"', 'brand-v1.css?v=2"'))
          import shutil
          updates = Path('recorded-songs-v1')
          import json
          manifest = json.loads((updates / 'sync-manifest.json').read_text(encoding='utf-8'))
          assert manifest['schema'] == 'uropedia-live-sync-v1'
          assert len(list(updates.rglob('*.html'))) == len(manifest['songs'])
          assert len({song['songId'] for song in manifest['songs']}) == len(manifest['songs'])
          for rel, digest in manifest['files'].items():
              source = (updates / rel).resolve()
              assert source.is_relative_to(updates.resolve()), 'Unsafe overlay path'
              assert hashlib.sha256(source.read_bytes()).hexdigest() == digest, rel
          for song in manifest['songs']:
              html = (updates / song['page']).read_text(encoding='utf-8')
              assert song['youtubeUrl'] in html
              assert song['asset'] in html
              assert 'id="episodes"' in html and 'id="interpretation"' in html
              assert song['page'] in manifest['files'] and song['asset'] in manifest['files']
          for item in updates.rglob('*'):
              if item.is_file():
                  dest = target / item.relative_to(updates)
                  assert dest.resolve().is_relative_to(target)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(item, dest)
          profile = target / 'people/umami.html'
          html = profile.read_text(encoding='utf-8')
          heading = '<section id="racing"><h2>競馬への向き合い方</h2>'
          link = '<p>休日は出馬表を読み、週末のレースの予想や振り返りをXに投稿している。</p><p><a href="https://x.com/umami_0804">Xで競馬予想を見る</a></p>'
          if link not in html:
              assert html.count(heading) == 1, 'Expected one Umami racing section'
              profile.write_text(html.replace(heading, heading + link, 1), encoding='utf-8')
          html = profile.read_text(encoding='utf-8')
          x_link = '<p><a href="https://x.com/umami_0804">Xで競馬予想を見る</a></p>'
          note = '<p>noteでは、馬や騎手の歩み、血統、再戦の背景を取り上げ、週末のレースにつながる競馬の読み物を書いている。</p><p><a href="https://note.com/umami_0804">noteで競馬の読み物を読む</a></p>'
          if note not in html:
              assert html.count(x_link) == 1, 'Expected one Umami X link'
              profile.write_text(html.replace(x_link, x_link + note, 1), encoding='utf-8')
          assert (target / 'index.html').is_file()
          assert len(list(target.rglob('*.html'))) == 849
          for rel, digest in manifest['files'].items():
              assert hashlib.sha256((target / rel).read_bytes()).hexdigest() == digest, rel
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
